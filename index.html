<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Programme Reach — Law Firm Ready</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --ink:#0b2b26;
    --teal-900:#0b3b36;
    --teal-700:#0f766e;
    --teal-600:#0d9488;
    --teal-400:#2dd4bf;
    --teal-200:#99f6e4;
    --teal-100:#ccfbf1;
    --paper:#fbfaf7;
    --card:#ffffff;
    --line:#e6e2d8;
    --muted:#5b6b68;
    --shadow: 0 10px 30px rgba(11,43,38,.12), 0 2px 8px rgba(11,43,38,.08);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family: "Söhne","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--paper);
    color:var(--ink);
    overflow:hidden;
  }
  #map{
    position:absolute; inset:0;
    background:#eef2f1;
  }
  .leaflet-container{ font-family: inherit; background:#eef2f1; }

  /* ---- floating panel ---- */
  #panel{
    position:absolute; top:20px; left:20px; z-index:1000;
    width:322px;
    max-height:calc(100vh - 40px);
    display:flex; flex-direction:column;
    gap:12px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:16px 18px;
  }
  #hideBtn{
    align-self:flex-start;
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:999px;
    padding:9px 16px;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.01em;
    cursor:pointer;
    box-shadow:var(--shadow);
  }
  #hideBtn:hover{ background:var(--teal-900); }

  .eyebrow{
    font-size:10.5px; text-transform:uppercase; letter-spacing:.12em;
    color:var(--teal-700); font-weight:700; margin:0 0 4px;
  }
  h1{ font-size:19px; margin:0 0 4px; line-height:1.25; letter-spacing:-.01em; }
  .sub{ font-size:12.5px; color:var(--muted); margin:0; line-height:1.4; }

  .tabs{ display:flex; gap:6px; margin-top:2px; }
  .tab{
    flex:1; text-align:center; padding:9px 6px; border-radius:9px;
    font-size:12.5px; font-weight:600; cursor:pointer; border:1px solid var(--line);
    background:#f6f5f1; color:var(--ink); transition:.15s;
  }
  .tab.active{ background:var(--ink); color:#fff; border-color:var(--ink); }

  .section-title{
    font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
    color:var(--muted); display:flex; justify-content:space-between; align-items:center;
    margin-bottom:10px;
  }
  .linklike{
    font-size:11px; font-weight:600; color:var(--teal-700); cursor:pointer; text-transform:none;
    letter-spacing:0;
  }
  .linklike:hover{ text-decoration:underline; }

  #catList{ display:flex; flex-direction:column; gap:7px; max-height:236px; overflow-y:auto; padding-right:2px; }
  .catRow{
    display:flex; align-items:center; gap:9px; font-size:12.5px;
    padding:6px 8px; border-radius:8px; cursor:pointer; user-select:none;
    border:1px solid transparent;
  }
  .catRow:hover{ background:#f6f5f1; }
  .catRow input{ accent-color: var(--teal-600); width:14px; height:14px; flex-shrink:0; }
  .catRow .swatch{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .catRow .catName{ flex:1; }
  .catRow .catCount{ color:var(--muted); font-variant-numeric:tabular-nums; font-size:11.5px; }
  .catRow.dim{ opacity:.4; }

  .sliderRow{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .sliderRow .lbl{ font-size:12.5px; font-weight:600; }
  .sliderRow .val{
    background:var(--ink); color:#fff; font-size:11px; font-weight:700;
    border-radius:999px; padding:2px 9px; min-width:22px; text-align:center;
  }
  input[type=range]{ width:100%; accent-color:var(--ink); }

  #summary{
    font-size:12.5px; color:var(--ink); font-weight:600; line-height:1.4;
  }
  #summary .n{ color:var(--teal-700); }

  .legendDot{
    display:inline-block; width:9px; height:9px; border-radius:50%;
    background:var(--teal-600); border:1.5px solid rgba(255,255,255,.9);
  }

  /* leaflet popups */
  .leaflet-popup-content-wrapper{ border-radius:12px; box-shadow:var(--shadow); }
  .popupTitle{ font-weight:700; font-size:13.5px; margin-bottom:2px; }
  .popupSub{ font-size:11.5px; color:var(--muted); margin-bottom:8px; }
  .popupTotal{ font-size:12.5px; font-weight:700; color:var(--teal-700); margin-bottom:6px; }
  .popupRow{ display:flex; justify-content:space-between; font-size:11.5px; padding:2px 0; }
  .popupRow .k{ color:var(--muted); }

  #showBtn{
    display:none; position:absolute; top:20px; left:20px; z-index:1000;
    background:var(--ink); color:#fff; border:none; border-radius:999px;
    padding:10px 18px; font-size:12.5px; font-weight:600; cursor:pointer; box-shadow:var(--shadow);
  }

  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:99px; }
</style>
</head>
<body>

<div id="map"></div>

<button id="showBtn">Show Dashboard</button>

<div id="panel">
  <button id="hideBtn">Hide Dashboard</button>

  <div class="card">
    <p class="eyebrow">Law Firm Ready</p>
    <h1>Programme Reach</h1>
    <p class="sub">Interactive footprint of every student and volunteer touchpoint — filter by programme type to see where each reaches.</p>
    <div class="tabs">
      <div class="tab active" data-tab="india">India Cities</div>
      <div class="tab" data-tab="global">Global Countries</div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">
      <span>Programme type</span>
      <span class="linklike" id="catToggleAll">Select all</span>
    </div>
    <div id="catList"></div>
  </div>

  <div class="card">
    <div class="sliderRow">
      <span class="lbl">Min. touchpoints</span>
      <span class="val" id="minVal">1</span>
    </div>
    <input type="range" id="minSlider" min="1" max="50" value="1" />
  </div>

  <div class="card">
    <div id="summary"></div>
  </div>
</div>

<script>
const DATA = JSON.parse(document.getElementById('mapdata').textContent);
const CATS = DATA.categories;

// consistent single accent (bubble fill), category colors used only in legend dots
const CAT_COLORS = ["#0d9488","#2563eb","#d97706","#7c3aed","#dc2626","#059669","#0891b2","#c026d3","#6b7280"];

let state = {
  tab: 'india',
  selectedCats: new Set(CATS),
  minCount: 1
};

// ---- map setup ----
const map = L.map('map', { zoomControl:false, attributionControl:true }).setView([22.5, 80], 5);
L.control.zoom({ position:'bottomright' }).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

let markerLayer = L.layerGroup().addTo(map);

function countFor(point){
  let n = 0;
  for (const c of state.selectedCats) n += (point.cats[c] || 0);
  return n;
}

function radiusFor(n){
  // area-proportional-ish scaling
  return Math.max(5, Math.sqrt(n) * 3.1);
}

function buildPopup(point, label, sublabel){
  const total = countFor(point);
  let rows = '';
  CATS.forEach((c, i) => {
    const v = point.cats[c] || 0;
    if (v > 0 && state.selectedCats.has(c)){
      rows += `<div class="popupRow"><span class="k"><span class="legendDot" style="background:${CAT_COLORS[i]}"></span> ${c}</span><span>${v}</span></div>`;
    }
  });
  return `<div class="popupTitle">${label}</div>
    <div class="popupSub">${sublabel}</div>
    <div class="popupTotal">${total} touchpoint${total===1?'':'s'}</div>
    ${rows}`;
}

function render(){
  markerLayer.clearLayers();
  const points = state.tab === 'india' ? DATA.india : DATA.countries;
  let shown = 0, totalTouch = 0;

  points.forEach(p => {
    const n = countFor(p);
    if (n < state.minCount || n === 0) return;
    shown++; totalTouch += n;
    const label = state.tab === 'india' ? p.city : p.country;
    const sublabel = state.tab === 'india' ? p.state : 'Global';
    const marker = L.circleMarker([p.lat, p.lon], {
      radius: radiusFor(n),
      color: '#ffffff',
      weight: 1.5,
      fillColor: '#0d9488',
      fillOpacity: 0.72
    });
    marker.bindPopup(buildPopup(p, label, sublabel));
    marker.addTo(markerLayer);
  });

  const scopeLabel = state.tab === 'india' ? 'mapped cities' : 'countries reached';
  document.getElementById('summary').innerHTML =
    `<span class="n">${shown}</span> ${scopeLabel} &middot; <span class="n">${totalTouch.toLocaleString()}</span> touchpoints in view`;
}

// ---- category list ----
const catListEl = document.getElementById('catList');
CATS.forEach((c, i) => {
  const totalAll = DATA.india.reduce((s,p)=>s+(p.cats[c]||0),0) + DATA.countries.reduce((s,p)=>s+(p.cats[c]||0),0);
  const row = document.createElement('label');
  row.className = 'catRow';
  row.innerHTML = `<input type="checkbox" checked data-cat="${c}" />
    <span class="swatch" style="background:${CAT_COLORS[i]}"></span>
    <span class="catName">${c}</span>
    <span class="catCount">${totalAll.toLocaleString()}</span>`;
  catListEl.appendChild(row);
});
catListEl.addEventListener('change', (e) => {
  const t = e.target;
  if (t.matches('input[type=checkbox]')){
    const c = t.dataset.cat;
    if (t.checked) state.selectedCats.add(c); else state.selectedCats.delete(c);
    document.querySelectorAll('.catRow').forEach(r=>{
      const cb = r.querySelector('input');
      r.classList.toggle('dim', !cb.checked);
    });
    render();
  }
});

let allSelected = true;
document.getElementById('catToggleAll').addEventListener('click', () => {
  allSelected = !allSelected;
  document.querySelectorAll('#catList input[type=checkbox]').forEach(cb => {
    cb.checked = allSelected;
    const c = cb.dataset.cat;
    if (allSelected) state.selectedCats.add(c); else state.selectedCats.delete(c);
    cb.closest('.catRow').classList.toggle('dim', !allSelected);
  });
  document.getElementById('catToggleAll').textContent = allSelected ? 'Select all' : 'Clear all';
  render();
});

// ---- tabs ----
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    state.tab = tab.dataset.tab;
    map.setView(state.tab === 'india' ? [22.5,80] : [20,20], state.tab === 'india' ? 5 : 2);
    render();
  });
});

// ---- slider ----
const slider = document.getElementById('minSlider');
slider.addEventListener('input', () => {
  state.minCount = parseInt(slider.value, 10);
  document.getElementById('minVal').textContent = state.minCount;
  render();
});

// ---- hide/show dashboard ----
document.getElementById('hideBtn').addEventListener('click', () => {
  document.getElementById('panel').style.display = 'none';
  document.getElementById('showBtn').style.display = 'block';
});
document.getElementById('showBtn').addEventListener('click', () => {
  document.getElementById('panel').style.display = 'flex';
  document.getElementById('showBtn').style.display = 'none';
});

render();
</script>
