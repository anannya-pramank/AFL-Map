<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Programme Reach — All For Law</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --yellow:#FBD727;
    --yellow-soft:#FCE06B;
    --purple:#2B154A;
    --purple-soft:#4C2889;
    --cream:#FFFCEE;
    --pink:#FB2780;
    --orange:#FB8227;
    --dull:#D2D2D2;
    --ink:#262106;
    --muted:#7a7461;
    --line:#ece5cf;
    --shadow: 0 10px 32px rgba(43,21,74,.14), 0 2px 8px rgba(43,21,74,.08);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{ font-family:"Poppins",sans-serif; background:var(--cream); color:var(--ink); overflow:hidden; }
  h1,h2,h3,.headline{ font-family:"Baloo 2",sans-serif; }

  #map{ position:absolute; inset:0; background:#e9e6d8; }
  .leaflet-container{ background:#e9e6d8; font-family:"Poppins",sans-serif; }
  .leaflet-tile-pane{ filter: saturate(0.85) brightness(1.06) contrast(1.03); }

  #topbar{
    position:absolute; top:20px; left:20px; z-index:1000;
    display:flex; align-items:center; gap:10px;
  }
  #brandbar{
    display:flex; align-items:center; gap:10px;
    background:var(--purple); color:var(--yellow);
    padding:10px 18px; border-radius:999px; box-shadow:var(--shadow);
    font-family:"Baloo 2",sans-serif; font-weight:700; font-size:15px; letter-spacing:.01em;
  }
  #brandbar .dot{ width:8px; height:8px; border-radius:50%; background:var(--pink); }

  #panelToggle{
    display:flex; align-items:center; gap:7px;
    background:#fff; color:var(--purple); border:1px solid var(--line);
    padding:10px 16px; border-radius:999px; box-shadow:var(--shadow);
    font-family:"Poppins",sans-serif; font-weight:600; font-size:12.5px;
    cursor:pointer; letter-spacing:.01em; user-select:none;
  }
  #panelToggle:hover{ background:var(--cream); }
  #panelToggle .icon{ width:14px; height:14px; display:inline-block; }

  #panel{
    position:absolute; top:76px; left:20px; z-index:1000;
    width:320px; max-height:calc(100vh - 96px);
    display:flex; flex-direction:column; gap:12px;
    overflow-y:auto; padding-right:2px;
  }
  #panel.hidden{ display:none; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:18px 20px; }
  h1.title{ font-size:21px; margin:0 0 4px; color:var(--purple); line-height:1.2; }
  p.sub{ font-size:12.5px; color:var(--muted); margin:0; line-height:1.45; }

  #breadcrumbs{ display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .crumb{
    background:var(--cream); color:var(--purple); border:1px solid var(--line);
    border-radius:999px; padding:6px 13px; font-size:12px; font-weight:700;
    cursor:pointer; font-family:"Poppins",sans-serif;
  }
  .crumb:hover{ background:var(--yellow-soft); }
  .crumb.current{ background:var(--purple); color:var(--yellow); cursor:default; }

  .statHero{ display:flex; align-items:baseline; gap:8px; margin-bottom:2px; }
  .statHero .n{ font-family:"Baloo 2",sans-serif; font-size:34px; color:var(--pink); line-height:1; }
  .statHero .lbl{ font-size:12.5px; color:var(--muted); font-weight:600; }
  .statRow{ display:flex; gap:18px; margin-top:10px; }
  .statMini .n{ font-family:"Baloo 2",sans-serif; font-size:19px; color:var(--purple); }
  .statMini .lbl{ font-size:11px; color:var(--muted); font-weight:600; }

  .section-title{
    font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
    color:var(--muted); margin-bottom:10px;
  }
  #listCard{ display:none; }
  #entryList{ display:flex; flex-direction:column; gap:6px; max-height:320px; overflow-y:auto; }
  .entryRow{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 10px; border-radius:10px; font-size:12.5px; cursor:pointer; transition:.12s;
  }
  .entryRow:hover{ background:var(--cream); }
  .entryRow.static{ cursor:default; }
  .entryRow.static:hover{ background:none; }
  .entryRow .name{ font-weight:600; color:var(--ink); }
  .entryRow .badge{
    background:var(--purple); color:var(--yellow); font-weight:700; font-size:11px;
    border-radius:999px; padding:2px 9px; min-width:20px; text-align:center;
  }

  .legendRow{ display:flex; align-items:center; gap:8px; margin-top:10px; font-size:11px; color:var(--muted); }
  .legendGrad{ width:110px; height:8px; border-radius:99px; background:linear-gradient(90deg, var(--dull), var(--yellow-soft), var(--orange)); }

  .leaflet-tooltip.cityTip{
    background:var(--purple); color:#fff; border:none; border-radius:8px;
    padding:6px 10px; font-family:"Poppins",sans-serif; font-weight:600; font-size:12px; box-shadow:var(--shadow);
  }
  .leaflet-tooltip.cityTip .n{ color:var(--yellow); font-weight:700; }
  .leaflet-tooltip.stateTip{
    background:#fff; color:var(--purple); border:1px solid var(--line); border-radius:8px;
    padding:5px 10px; font-family:"Poppins",sans-serif; font-weight:600; font-size:12px; box-shadow:var(--shadow);
  }

  /* mascot map markers */
  .mascotMarker{ background:none !important; border:none !important; }
  .mascotMarker img{
    display:block; pointer-events:auto; user-select:none;
    filter: drop-shadow(0 2px 3px rgba(43,21,74,.30));
    transition: transform .12s ease;
    transform-origin: 50% 100%;
  }
  .mascotMarker:hover img{ transform: scale(1.12); }

  /* floating mascot analytics widget (bottom-right) */
  #mascotWidget{
    position:absolute; right:20px; bottom:96px; z-index:1000;
    display:flex; align-items:flex-end; gap:10px;
    opacity:0; transform:translateY(14px);
    pointer-events:none;
    transition:opacity .22s ease, transform .22s ease;
  }
  #mascotWidget.visible{ opacity:1; transform:translateY(0); pointer-events:auto; }
  #mascotWidgetBubble{
    position:relative; width:236px;
    background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow);
    padding:14px 16px;
  }
  #mascotWidgetBubble::after{
    content:""; position:absolute; right:28px; bottom:-7px;
    width:14px; height:14px; background:#fff;
    border-right:1px solid var(--line); border-bottom:1px solid var(--line);
    transform:rotate(45deg);
  }
  #mascotWidgetHead{ margin-bottom:9px; }
  #mascotWidgetTitle{ display:block; font-family:"Baloo 2",sans-serif; font-weight:700; color:var(--purple); font-size:15px; line-height:1.2; }
  #mascotWidgetSub{ display:block; font-size:10px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.07em; margin-top:2px; }
  #mascotWidgetBody{ display:flex; flex-direction:column; gap:7px; }
  .mwStat{ display:flex; align-items:flex-start; gap:7px; font-size:12px; color:var(--ink); line-height:1.4; }
  .mwStat .mwIcon{ font-size:14px; line-height:1.4; }
  .mwStat b{ color:var(--pink); }
  #mascotWidgetFoot{ margin-top:9px; padding-top:8px; border-top:1px solid var(--line); font-size:9.5px; color:var(--muted); }
  #mascotWidgetImg{
    width:74px; height:auto; display:block; pointer-events:none; flex-shrink:0;
    filter: drop-shadow(0 4px 9px rgba(43,21,74,.30));
  }

  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:99px; }
</style>
</head>
<body>

<div id="topbar">
  <div id="brandbar"><span class="dot"></span>All For Law</div>
  <div id="panelToggle">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><line x1="9" y1="4" x2="9" y2="20"></line></svg>
    <span id="panelToggleLbl">Hide panel</span>
  </div>
</div>
<div id="map"></div>

<div id="panel">
  <div class="card">
    <h1 class="title">Programme Reach</h1>
    <p class="sub">Click a country, then a state, to see exactly which cities our students and volunteers come from. Hover any mascot for its number.</p>
    <div id="breadcrumbs"></div>
  </div>

  <div class="card" id="statsCard">
    <div class="statHero"><span class="n" id="heroNum">0</span><span class="lbl" id="heroLbl">touchpoints worldwide</span></div>
    <div class="statRow" id="statRow">
      <div class="statMini"><div class="n" id="miniA">0</div><div class="lbl" id="miniALbl">countries</div></div>
      <div class="statMini"><div class="n" id="miniB">0</div><div class="lbl" id="miniBLbl">cities</div></div>
    </div>
    <div class="legendRow"><span>0</span><div class="legendGrad"></div><span>most reach</span></div>
  </div>

  <div class="card" id="listCard">
    <div class="section-title" id="listTitle">Entries</div>
    <div id="entryList"></div>
  </div>
</div>

<div id="mascotWidget">
  <div id="mascotWidgetBubble">
    <div id="mascotWidgetHead">
      <span id="mascotWidgetTitle">—</span>
      <span id="mascotWidgetSub">Outreach insights</span>
    </div>
    <div id="mascotWidgetBody"></div>
    <div id="mascotWidgetFoot">From the calling &amp; outreach list</div>
  </div>
  <img id="mascotWidgetImg" alt="" draggable="false">
</div>

  const idx = t * (stops.length - 1);
  const i0 = Math.floor(idx), i1 = Math.min(stops.length-1, i0+1), f = idx - i0;
  const c = stops[i0].map((v,k) => Math.round(v + (stops[i1][k]-v)*f));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

const MASCOT_ASPECT = 0.8375; // width / height of the mascot artwork

// ---- floating mascot analytics widget (bottom-right) ----
// Sourced from the calling/outreach list (universities & channels), keyed by state/country
// name — separate from the reach totals above, which come from the touchpoint counts.
const mascotWidgetEl = document.getElementById('mascotWidget');
const mascotWidgetImgEl = document.getElementById('mascotWidgetImg');
const mascotWidgetTitleEl = document.getElementById('mascotWidgetTitle');
const mascotWidgetBodyEl = document.getElementById('mascotWidgetBody');
mascotWidgetImgEl.src = MASCOT_STAND;

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function hideMascotWidget(){
  mascotWidgetEl.classList.remove('visible');
}

function showMascotWidget(key, label){
  const a = DATA.analytics && DATA.analytics[key];
  if (!a){ hideMascotWidget(); return; }

  mascotWidgetTitleEl.textContent = label;
  const topProg = a.topProgrammes && a.topProgrammes[0];
  const topUni = a.topUniversities && a.topUniversities[0];
  const rows = [];
  rows.push(`<div class="mwStat"><span class="mwIcon">🎓</span><span>${a.universities} colleges &amp; universities reached</span></div>`);
  if (topProg) rows.push(`<div class="mwStat"><span class="mwIcon">📣</span><span>Top channel: <b>${escapeHtml(topProg.name)}</b> (${topProg.count})</span></div>`);
  if (topUni) rows.push(`<div class="mwStat"><span class="mwIcon">🏫</span><span>Most engaged: <b>${escapeHtml(topUni.name)}</b> (${topUni.count})</span></div>`);
  mascotWidgetBodyEl.innerHTML = rows.join('');
  mascotWidgetEl.classList.add('visible');
}

// Bubble radius (still used to size the circle on the zoomed-in state view)
function cityRadius(n){
  const factor = (state.level === 'world' || state.level === 'country') ? 2.2 : 1.35;
  return Math.min(20, Math.max(2.6, Math.sqrt(n) * factor));
}

// On the zoomed-out views the mascot itself carries the data: bigger reach -> bigger mascot.
function mascotSize(n){
  const factor = (state.level === 'world' || state.level === 'country') ? 5.4 : 3.6;
  return Math.min(66, Math.max(24, Math.sqrt(n) * factor)); // px height
}

// Build a mascot marker. footLift raises the mascot's feet above the point so it
// appears to stand *on top of* a bubble (used at state level).
function mascotIcon(h, footLift){
  h = Math.round(h);
  const w = Math.round(h * MASCOT_ASPECT);
  return L.divIcon({
    className: 'mascotMarker',
    html: `<img src="${MASCOT_STAND}" width="${w}" height="${h}" draggable="false" alt="">`,
    iconSize: [w, h],
    iconAnchor: [w/2, h + (footLift||0)]   // anchor at the feet
  });
}

// Desired (uncrowded) radius for an India-overview reach circle, before collision shrinking.
function indiaCircleRadius(n){
  return Math.min(30, Math.max(6, Math.sqrt(n) * 2.4));
}

// India has 200+ cities, many only a few km apart — too close to ever draw as separate
// non-overlapping circles at country zoom. Greedily fold each city into the nearest
// already-placed bubble (biggest reach first) when it's within CLUSTER_PX of it, then
// size every remaining bubble by its combined reach so nothing overlaps.
function layoutIndiaCircles(list){
  const CLUSTER_PX = 20, PAD = 3, MIN_R = 5;

  const order = list.map((c, i) => i).sort((a, b) => list[b].total - list[a].total);
  const clusters = [];
  order.forEach(i => {
    const c = list[i];
    const pt = map.latLngToContainerPoint([c.lat, c.lon]);
    const near = clusters.find(cl => cl.pt.distanceTo(pt) <= CLUSTER_PX);
    if (near){ near.total += c.total; near.cities.push(c); }
    else clusters.push({ pt, total: c.total, cities: [c] });
  });

  clusters.sort((a, b) => b.total - a.total);
  const placed = [];
  clusters.forEach(cl => {
    let r = indiaCircleRadius(cl.total);
    placed.forEach(p => { r = Math.min(r, p.pt.distanceTo(cl.pt) - p.r - PAD); });
    cl.r = Math.max(MIN_R, r);
    placed.push(cl);
  });
  return clusters;
}

let lastIndiaCities = null; // re-laid out on zoom, since pixel spacing between cities changes

function renderCities(list){
  cityLayerGroup.clearLayers();

  if (state.level === 'india'){
    // India overview: reach shown as neat, non-overlapping circles — no mascots here.
    lastIndiaCities = list;
    layoutIndiaCircles(list).forEach(cl => {
      const latlng = map.containerPointToLatLng(cl.pt);
      const tip = cl.cities.length === 1
        ? `${cl.cities[0].city}<br><span class="n">${cl.total}</span> touchpoints`
        : `${cl.cities.length} cities near ${cl.cities[0].city}<br><span class="n">${cl.total}</span> touchpoints`;
      L.circleMarker(latlng, {
        radius: cl.r, color:'#fff', weight:1.5,
        fillColor:'#FB2780', fillOpacity:0.85
      }).bindTooltip(tip, { className:'cityTip', sticky:true }).addTo(cityLayerGroup);
    });
    return;
  }

  const stateLevel = (state.level === 'state');
  list.forEach(c => {
    const tip = `${c.city}<br><span class="n">${c.total}</span> touchpoints`;
    if (stateLevel){
      // Zoomed in: the bubble reappears and the mascot stands over it.
      const r = cityRadius(c.total);
      L.circleMarker([c.lat, c.lon], {
        radius: r, color:'#fff', weight:1,
        fillColor:'#FB2780', fillOpacity:0.85, interactive:false
      }).addTo(cityLayerGroup);
      const m = L.marker([c.lat, c.lon], { icon: mascotIcon(38, r*0.85), riseOnHover:true });
      m.bindTooltip(tip, { className:'cityTip', sticky:true });
      m.addTo(cityLayerGroup);
    } else {
      // Zoomed out (world / other countries): a mascot for every point, no circle.
      const m = L.marker([c.lat, c.lon], { icon: mascotIcon(mascotSize(c.total), 0), riseOnHover:true });
      m.bindTooltip(tip, { className:'cityTip', sticky:true });
      m.addTo(cityLayerGroup);
    }
  });
}

// Circle pixel-spacing changes with zoom, so re-run the no-overlap layout after zooming.
map.on('zoomend', () => {
  if (state.level === 'india' && lastIndiaCities) renderCities(lastIndiaCities);
});

function renderList(items, title, onClickRow, clickable){
  document.getElementById('listTitle').textContent = title;
  const el = document.getElementById('entryList');
  el.innerHTML = '';
  items.slice().sort((a,b)=>b.total-a.total).forEach(it => {
    const row = document.createElement('div');
    row.className = 'entryRow' + (clickable ? '' : ' static');
    row.innerHTML = `<span class="name">${it.name}</span><span class="badge">${it.total}</span>`;
    if (clickable) row.addEventListener('click', () => onClickRow(it));
    el.appendChild(row);
  });
  document.getElementById('listCard').style.display = 'block';
}
function hideList(){ document.getElementById('listCard').style.display = 'none'; }

function setHero(num, lbl){
  document.getElementById('heroNum').textContent = num.toLocaleString();
  document.getElementById('heroLbl').textContent = lbl;
}
function setMinis(aNum, aLbl, bNum, bLbl, showA){
  document.getElementById('statRow').style.display = 'flex';
  document.getElementById('miniA').parentElement.style.display = showA ? 'block' : 'none';
  document.getElementById('miniA').textContent = aNum; document.getElementById('miniALbl').textContent = aLbl;
  document.getElementById('miniB').textContent = bNum; document.getElementById('miniBLbl').textContent = bLbl;
}

function renderBreadcrumbs(){
  const el = document.getElementById('breadcrumbs');
  el.innerHTML = '';
  // World and India are always-available quick tabs, independent of drill depth
  const crumbs = [
    { label:'World', fn: goWorld, active: state.level === 'world' },
    { label:'India', fn: enterIndia, active: state.level === 'india' }
  ];
  if (state.level === 'state') crumbs.push({ label: state.stateName, fn: null, active:true });
  if (state.level === 'country') crumbs.push({ label: state.country, fn: null, active:true });
  crumbs.forEach((c) => {
    const b = document.createElement('span');
    b.className = 'crumb' + (c.active ? ' current' : '');
    b.textContent = c.label;
    if (!c.active && c.fn) b.addEventListener('click', c.fn);
    el.appendChild(b);
  });
}

// ---- WORLD level ----
function worldStyle(feature){
  const total = feature.properties.total || 0;
  return total
    ? { fillColor: fillFor(total, maxCountryTotal), fillOpacity:0.72, color:'#fff', weight:1.2 }
    : { fillColor:'#000', fillOpacity:0, color:'#8a8468', weight:0.6 };
}
worldLayer = null;
function buildWorldLayer(featureCollection){
  worldLayer = L.geoJSON(featureCollection, {
    style: worldStyle,
    onEachFeature: (feature, layer) => {
      const p = feature.properties;
      if (p.total){
        layer.bindTooltip(`<b>${p.name}</b><br><span style="color:#FB2780;font-weight:700;">${p.total}</span> touchpoints`, { className:'stateTip', sticky:true });
      } else {
        layer.bindTooltip(`<b>${p.name}</b><br>No reach recorded yet`, { className:'stateTip', sticky:true });
      }
      layer.on('mouseover', () => { if (layer !== selectedCountryLayer) layer.setStyle({ weight:2.2 }); });
      layer.on('mouseout', () => { if (layer !== selectedCountryLayer) layer.setStyle(worldStyle(feature)); });
      layer.on('click', () => {
        if (!p.total) return;
        if (p.name === 'India') enterIndia(); else enterCountry(p.name, layer);
      });
    }
  });
}

// Fetch real-world (accurate) country boundaries so borders line up with the basemap,
// then join our own touchpoint totals onto them by ISO3 code.
fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson')
  .then(r => r.json())
  .then(fc => {
    fc.features.forEach(f => {
      const code = f.properties.ADM0_A3 || f.properties.ISO_A3 || f.properties.ISO_A3_EH;
      const match = countryTotalsById[code];
      f.properties.total = match ? match.total : 0;
      f.properties.name = match ? match.name : (f.properties.NAME || f.properties.ADMIN);
      f.id = code;
    });
    buildWorldLayer(fc);
    goWorld();
  })
  .catch(() => {
    // Fallback to the bundled (lower-detail) shapes if the live boundary data can't be fetched
    buildWorldLayer(DATA.world);
    goWorld();
  });

// ---- INDIA STATES level ----
function stateStyle(feature){
  const total = feature.properties.total || 0;
  return total
    ? { fillColor: fillFor(total, maxStateTotal), fillOpacity:0.72, color:'#fff', weight:1.3 }
    : { fillColor:'#000', fillOpacity:0, color:'#8a8468', weight:0.7 };
}
indiaLayer = L.geoJSON(DATA.indiaStates, {
  style: stateStyle,
  onEachFeature: (feature, layer) => {
    const p = feature.properties;
    if (p.total){
      layer.bindTooltip(`<b>${p.ST_NM}</b><br><span style="color:#FB2780;font-weight:700;">${p.total}</span> touchpoints &middot; ${p.cityCount} cities`, { className:'stateTip', sticky:true });
    } else {
      layer.bindTooltip(`<b>${p.ST_NM}</b><br>No reach recorded yet`, { className:'stateTip', sticky:true });
    }
    layer.on('mouseover', () => { if (layer !== selectedStateLayer) layer.setStyle({ weight:2.2 }); });
    layer.on('mouseout', () => { if (layer !== selectedStateLayer) layer.setStyle(stateStyle(feature)); });
    layer.on('click', () => { if (p.total) enterState(p.ST_NM, layer); });
  }
});

// ---- navigation functions ----
function goWorld(){
  state = { level:'world', country:null, stateName:null };
  if (map.hasLayer(indiaLayer)) map.removeLayer(indiaLayer);
  if (!map.hasLayer(worldLayer)) worldLayer.addTo(map);
  if (selectedCountryLayer){ selectedCountryLayer.setStyle(worldStyle(selectedCountryLayer.feature)); selectedCountryLayer = null; }
  if (selectedStateLayer){ selectedStateLayer.setStyle(stateStyle(selectedStateLayer.feature)); selectedStateLayer = null; }
  map.setView(WORLD_VIEW.center, WORLD_VIEW.zoom);
  renderCities(DATA.cities.filter(c => c.country !== 'India'));
  const totalAll = DATA.cities.reduce((s,c)=>s+c.total,0);
  const countriesWithData = DATA.world.features.filter(f => f.properties.total).length;
  setHero(totalAll, 'touchpoints worldwide');
  setMinis(countriesWithData, 'countries reached', DATA.cities.length, 'cities mapped', true);
  hideMascotWidget();
  hideList();
  renderList(
    DATA.world.features.filter(f=>f.properties.total).map(f=>({name:f.properties.name, total:f.properties.total, _f:f})),
    'Countries', (it) => { if (it.name==='India') enterIndia(); else {
        const lyr = worldLayer.getLayers().find(l => l.feature.properties.name === it.name);
        enterCountry(it.name, lyr);
    }}, true
  );
  renderBreadcrumbs();
}

function enterIndia(){
  state = { level:'india', country:'India', stateName:null };
  if (map.hasLayer(worldLayer)) map.removeLayer(worldLayer);
  if (!map.hasLayer(indiaLayer)) indiaLayer.addTo(map);
  if (selectedCountryLayer){ selectedCountryLayer.setStyle(worldStyle(selectedCountryLayer.feature)); selectedCountryLayer = null; }
  // Zooming back out from a state: drop that state's bold outline.
  if (selectedStateLayer){ selectedStateLayer.setStyle(stateStyle(selectedStateLayer.feature)); selectedStateLayer = null; }
  map.setView(INDIA_VIEW.center, INDIA_VIEW.zoom);
  const indiaCities = DATA.cities.filter(c => c.country === 'India');
  renderCities(indiaCities);
  const total = indiaCities.reduce((s,c)=>s+c.total,0);
  const statesWithData = DATA.indiaStates.features.filter(f=>f.properties.total).length;
  setHero(total, 'touchpoints in India');
  setMinis(statesWithData, 'states reached', indiaCities.length, 'cities mapped', true);
  hideMascotWidget();
  renderList(
    DATA.indiaStates.features.filter(f=>f.properties.total).map(f=>({name:f.properties.ST_NM, total:f.properties.total})),
    'States', (it) => {
      const lyr = indiaLayer.getLayers().find(l => l.feature.properties.ST_NM === it.name);
      enterState(it.name, lyr);
    }, true
  );
  renderBreadcrumbs();
}

function enterState(stateName, layer){
  state = { level:'state', country:'India', stateName };
  if (selectedStateLayer) selectedStateLayer.setStyle(stateStyle(selectedStateLayer.feature));
  selectedStateLayer = layer;
  layer.setStyle({ color:'#2B154A', weight:3.5, fillOpacity:0.6 });
  layer.bringToFront();
  map.fitBounds(layer.getBounds(), { padding:[60,60] });
  const cities = DATA.cities.filter(c => c.admin === stateName
    && c.city.trim().toLowerCase() !== stateName.trim().toLowerCase());
  renderCities(cities);
  const total = layer.feature.properties.total;
  setHero(total, `touchpoints in ${stateName}`);
  setMinis(0,'', cities.length, 'cities', false);
  showMascotWidget(stateName, stateName);
  renderList(cities.map(c=>({name:c.city, total:c.total})), `Cities in ${stateName}`, null, false);
  renderBreadcrumbs();
}

function enterCountry(countryName, layer){
  state = { level:'country', country:countryName, stateName:null };
  if (selectedCountryLayer) selectedCountryLayer.setStyle(worldStyle(selectedCountryLayer.feature));
  selectedCountryLayer = layer;
  layer.setStyle({ color:'#2B154A', weight:3, fillOpacity:0.6 });
  layer.bringToFront();
  map.fitBounds(layer.getBounds(), { padding:[70,70], maxZoom:6 });
  const cities = DATA.cities.filter(c => c.country === countryName
    && c.city.trim().toLowerCase() !== countryName.trim().toLowerCase());
  renderCities(cities);
  const total = layer.feature.properties.total;
  setHero(total, `touchpoints in ${countryName}`);
  setMinis(0,'', cities.length, 'cities', false);
  showMascotWidget(countryName, countryName);
  renderList(cities.map(c=>({name:c.city, total:c.total})), `Cities in ${countryName}`, null, false);
  renderBreadcrumbs();
}

// ---- panel visibility toggle ----
const panelEl = document.getElementById('panel');
const toggleBtn = document.getElementById('panelToggle');
const toggleLbl = document.getElementById('panelToggleLbl');
let panelVisible = true;
toggleBtn.addEventListener('click', () => {
  panelVisible = !panelVisible;
  panelEl.classList.toggle('hidden', !panelVisible);
  toggleLbl.textContent = panelVisible ? 'Hide panel' : 'Show panel';
});
</script>
</body>
</html>
